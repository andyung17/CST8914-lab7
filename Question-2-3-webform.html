<!doctype html>
<html lang="en">
  <head>
    <title>
      Form validation with messages on top: Code example - Accessibility
      Developer Guide example
    </title>
    <meta charset="utf-8" />
    <style>
      .control,
      fieldset {
        margin: 6px 0;
      }

      label {
        display: inline-block;
        width: 120px;
        vertical-align: top;
      }

      input + label {
        width: auto;
      }

      .error,
      .required {
        /* changed to black since it is more accessible to colour blind users*/
        color: rgb(0, 0, 0);
      }

      fieldset ul {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Feedback form</h1>
    <!-- Adding text to tell required fields/inputs -->
    <p>Fields marked "required" must be completed</p>
    <form>
      <div class="control">
        <!-- Adding (Required) and required attribute to make it more accessible -->
         <!-- Adding for="name" to associate label with input -->
        <label for="name">Full name <span class="required">(Required)</span></label
        ><input id="name" name="name" type="text"/>
      </div>
      <div class="control">
        <!-- Adding for="biography" to associate label with input -->
         <!-- Adding aria-describedby to provide extra information on what to include in biography -->
        <label for="biography">Biography (Required)</label
        ><textarea
          id="biography"
          name="biography"
          type="text"
          aria-describedby="biography-hint"
        ></textarea>
        <!-- adding a new line to make it text more readable -->
        <p></p>
        <span id="biography-hint">Include examples on your skills in JavaScript.</span>
      </div>

      <!-- using a field set, grouping related controls -->
      <fieldset>
        <!-- Changed div to legend as it gives the group the question/context -->
        <legend>Select a Gender (Required)</legend>
        <div class="control">
          <!-- Adding for="male" to associate label with input -->
          <input id="gender_male" name="gender" type="radio" value="male" /><label
            for="gender_male"
            >Male</label
          >
        </div>
  
        <div class="control">
          <input
            id="gender_female"
            name="gender"
            type="radio"
            value="female"
          />
          <!-- Adding for="female" to associate label with input -->
          <label for="gender_female">Female</label>
        </div>
      </fieldset>

      <div class="control">
        <input
          id="accept_agbs"
          name="accept_agbs"
          type="checkbox"
          value="1"
        />
        <!-- Adding for="accept_agbs" to associate label with input -->
        <label for="accept_agbs">I accept the terms and conditions (Required)</label>
      </div>
      <div class="control">
        <input name="validate" type="hidden" value="1" /><input
          type="submit"
          value="Register"
        />
      </div>
    </form>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
      integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
      crossorigin="anonymous"
    ></script>
    <script>
      "use strict";

      (function () {
        var validateInput;

        $.urlParam = function (name) {
          var results;
          results = new RegExp("[?&]" + name + "=([^&#]*)").exec(
            window.location.href
          );

          if (results === null) {
            return null;
          } else {
            return decodeURI(results[1]) || null;
          }
        };

        validateInput = function validateInput(input, message) {
          var $elementToDescribe,
            $error,
            $errorContainer,
            $fieldset,
            $input,
            $referencedElement,
            value;
          $input = $('[name="' + input + '"]');

          if ((value = $.urlParam(input)) === null) {
            if ($("fieldset.errors").length === 0) {
              $("form").prepend(
                '<fieldset class="errors"><legend>Errors</legend><ul></ul></fieldset>'
              );
            }

            $referencedElement = null;
            $elementToDescribe = null;
            $errorContainer = $("fieldset.errors ul");

            if ($input.is(":radio")) {
              $fieldset = $input.closest("fieldset");
              $elementToDescribe = $fieldset;
              $referencedElement = $input.filter(":first");
            } else {
              $elementToDescribe = $input;
              $referencedElement = $input;
            }
            // R.G. hint: fix next line ;)
            // Had AI help understand how to connect the error to field
            // Changed the anchor to reference the inputs id such that it will focus on the input when clicked
            // Using referencedElement and the attribute id, this looks for null fields and links error message using the id of that input
            $error = $("<a href='#" + $referencedElement.attr('id') + "'>" + message + "</a>");
            $error.click(function (e) {
              // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers

              // Had AI explain that referencedElement is a jQuery object
              // Changing it to index 0 allows the focus to go to the corresponding html input element and focus it
              $referencedElement[0].focus()
              return e.preventDefault();
            });
            $elementToDescribe.attr("aria-describedby", input + "_description");
            $errorContainer.append("<li>").find("li:last").append($error);

            if ($(":not(form):focus").length === 0) {
              // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
              // Looked into this and it seems like this is no longer needs to be fixed
            }
          } else {
            if ($input.is(":checkbox")) {
              $input.attr("checked", true);
            }

            if ($input.is(":radio")) {
              return $input
                .filter('[value="' + value + '"]')
                .attr("checked", true);
            } else {
              return $input.val(value);
            }
          }
        };

        $(document).ready(function () {
          if ($.urlParam("validate")) {
            validateInput("name", "Please enter your name!");
            validateInput(
              "biography",
              "Please tell us something about your history!"
            );
            validateInput("gender", "Please tell us your gender!");
            validateInput(
              "accept_agbs",
              "You must accept our terms and conditions!"
            );

              // Changing the error checking to look at the field set instead and looking for when length is 0
              // Had AI help since I was having trouble with understanding how fieldsets were added
              // After understanding, looking at the fieldset list and each subsequent fieldset added and seeing if the length was 0 means no more errors and returns the alert
            if ($("fieldset.errors li").length === 0) {
              return alert("All inputs are valid.");
            }
          }
        });
      }).call(void 0);
    </script>
  </body>
</html>
